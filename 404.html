<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Réglisse a déménagé</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://asidequest.dev/reglisse/">
<script>
  // Ancien site de Réglisse (GitHub Pages) : renvoie vers la même page sur asidequest.dev/reglisse,
  // en gardant ?requête et #ancre (?code= des invitations, ?v= des pubs, #supprimer-compte).
  // Les apps déjà publiées et les invitations déjà envoyées pointent encore ici : ne pas supprimer.
  (function () {
    var pages = ['', 'index.html', 'join.html', 'privacy.html', 'cgu.html', 'mentions-legales.html', 'instagram.html'];
    var p = location.pathname.replace(/^\/done-privacy\/?/, '');
    if (p && p.indexOf('.') < 0 && p.slice(-1) !== '/') p += '.html';   // /join -> join.html
    if (pages.indexOf(p) < 0) p = '';                                   // chemin inconnu -> accueil
    location.replace('https://asidequest.dev/reglisse/' + p + location.search + location.hash);
  })();
</script>
<noscript><meta http-equiv="refresh" content="0; url=https://asidequest.dev/reglisse/"></noscript>
<style>
  html, body { margin: 0; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; background: #F5EFE7; color: #1A1814; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; }
  a { color: #E54D2E; }
</style>
</head>
<body>
<p>Réglisse a déménagé : <a href="https://asidequest.dev/reglisse/">asidequest.dev/reglisse</a></p>
