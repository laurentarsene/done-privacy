<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <!-- Même verrou que sur les autres pages : « default-src 'none' » interdit toute requête
         sortante. Cette page ne compte RIEN elle-même, aucun traceur, aucun appel : elle se
         contente d'envoyer vers les boutiques avec un lien de campagne. Le décompte se fait
         chez Apple (App Store Connect, campagnes) et chez Google (Play Console, UTM), de façon
         agrégée et anonyme. Une navigation n'est pas une requête de ressource, la CSP ne la
         bloque pas. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; font-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; form-action 'none'; base-uri 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Réglisse · Télécharger l'app</title>
    <!-- Page d'arrivée des pubs et du lien en bio Instagram : rien à faire dans un moteur
         de recherche, l'accueil s'en charge. -->
    <meta name="robots" content="noindex, follow">
    <meta name="description" content="Réglisse, l'app qui partage les tâches ménagères. Coloc, famille, couple.">
    <meta name="theme-color" content="#F5EFE7">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        [hidden] { display: none !important; }
        :root {
            color-scheme: light;
            --ink: #1A1814;
            --cream: #F5EFE7;
            --coral: #E54D2E;
            --ink-soft: rgba(26, 24, 20, 0.68);
            --ink-faint: rgba(26, 24, 20, 0.62);
            --ink-whisper: rgba(26, 24, 20, 0.08);
            --serif: ui-serif, "New York", "Iowan Old Style", Georgia, "Times New Roman", serif;
            --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            font-family: var(--sans);
            background: var(--cream);
            color: var(--ink);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 24px;
            -webkit-font-smoothing: antialiased;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 0%, rgba(244, 162, 97, 0.18) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 100%, rgba(180, 179, 214, 0.22) 0%, transparent 55%);
            pointer-events: none;
        }
        .card {
            position: relative;
            background: rgba(255, 253, 249, 0.72);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 28px;
            padding: 52px 36px 40px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow:
                0 1px 0 rgba(255, 255, 255, 0.8) inset,
                0 32px 80px rgba(26, 24, 20, 0.08),
                0 0 0 0.5px rgba(26, 24, 20, 0.06);
        }
        .logo {
            font-family: var(--serif);
            font-size: 52px;
            letter-spacing: -1px;
            line-height: 1;
            margin-bottom: 34px;
        }
        h1 {
            font-family: var(--serif);
            font-weight: 500;
            font-size: 32px;
            line-height: 1.12;
            letter-spacing: -0.5px;
            margin-bottom: 14px;
        }
        .sub {
            color: var(--ink-soft);
            font-family: var(--serif);
            font-style: italic;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 34px;
        }
        .btn-stack { display: flex; flex-direction: column; gap: 10px; }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 15px 28px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            background: var(--ink);
            color: var(--cream);
            box-shadow: 0 8px 24px rgba(26, 24, 20, 0.2);
        }
        .btn:focus-visible, .lien:focus-visible { outline: 2px solid var(--coral); outline-offset: 3px; }
        .lien {
            display: inline-block;
            margin-top: 24px;
            font-size: 13px;
            color: var(--ink-soft);
        }
        @media (max-width: 380px) {
            body { padding: 32px 16px; }
            .card { padding: 40px 22px 32px; border-radius: 24px; }
            .logo { font-size: 44px; }
            h1 { font-size: 28px; }
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="logo">Réglisse</div>
        <h1 id="titre">Les corvées, enfin partagées.</h1>
        <p class="sub" id="sous-titre">On coche, on marque des points, et plus personne ne compte dans sa tête.</p>
        <div class="btn-stack">
            <a id="app-store" class="btn" href="https://apps.apple.com/app/id6762408910">
                <svg width="15" height="18" viewBox="0 0 814 1000" fill="currentColor" aria-hidden="true"><path d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76.5 0-103.7 40.8-165.9 40.8s-105.6-57-155.5-127C46.7 790.7 0 663 0 541.8c0-194.4 126.4-297.5 250.8-297.5 66.1 0 121.2 43.4 162.7 43.4 39.5 0 101.1-46 176.3-46 28.5 0 130.9 2.6 198.3 99.2zm-234-181.5c31.1-36.9 53.1-88.1 53.1-139.3 0-7.1-.6-14.3-1.9-20.1-50.6 1.9-110.8 33.7-147.1 75.8-28.5 32.4-55.1 83.6-55.1 135.5 0 7.8 1.3 15.6 1.9 18.1 3.2.6 8.4 1.3 13.6 1.3 45.4 0 102.5-30.4 135.5-71.3z"/></svg>
                <span id="txt-app-store">Télécharger sur l'App Store</span>
            </a>
            <a id="play-store" class="btn" href="https://play.google.com/store/apps/details?id=dev.asidequest.reglisse">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M22.018 13.298l-3.919 2.218-3.515-3.493 3.543-3.521 3.891 2.202a1.49 1.49 0 0 1 0 2.594zM1.337.924a1.486 1.486 0 0 0-.112.568v21.017c0 .217.045.419.124.6l11.155-11.087L1.337.924zm12.207 10.065l3.258-3.238L3.45.195a1.466 1.466 0 0 0-.946-.179l11.04 10.973zm0 2.067l-11 10.933c.298.036.612-.016.9-.18l13.362-7.514-3.262-3.239z"/></svg>
                <span id="txt-play-store">Télécharger sur Google Play</span>
            </a>
        </div>
        <a class="lien" id="txt-site" href="index.html">Découvrir le site</a>
    </main>

    <script>
    (function () {
        // Jeton fournisseur App Store Connect (« pt »), propre au compte développeur.
        // Visible dans App Store Connect › Analytics › Campaigns. Vide = lien App Store simple.
        const PT = '128715151';

        // Une campagne par vidéo : /instagram?v=fr1 donne la campagne « ig-fr1 ».
        // Sans paramètre (lien en bio par exemple), la campagne s'appelle « ig ».
        // Apple limite le nom à 40 caractères ; on ne garde que [a-z0-9-] pour qu'il
        // reste lisible et identique dans les deux consoles.
        const params = new URLSearchParams(window.location.search);
        const v = (params.get('v') || '').toLowerCase().replace(/[^a-z0-9-]+/g, '-').replace(/^-+|-+$/g, '');
        const campagne = ('ig' + (v ? '-' + v : '')).slice(0, 40);

        const appStore = PT
            ? 'https://apps.apple.com/app/apple-store/id6762408910?pt=' + PT + '&ct=' + encodeURIComponent(campagne) + '&mt=8'
            : 'https://apps.apple.com/app/id6762408910';
        // Le referrer arrive tel quel dans la Play Console (acquisition par campagne UTM).
        const referrer = 'utm_source=instagram&utm_medium=social&utm_campaign=' + campagne;
        const playStore = 'https://play.google.com/store/apps/details?id=dev.asidequest.reglisse&referrer=' + encodeURIComponent(referrer);

        document.getElementById('app-store').href = appStore;
        document.getElementById('play-store').href = playStore;

        // Les pubs tournent en français et en anglais : la page suit la langue du téléphone.
        if (!/^fr/i.test(navigator.language || '')) {
            document.documentElement.lang = 'en';
            document.title = 'Réglisse · Get the app';
            document.getElementById('titre').textContent = 'Chores, finally shared.';
            document.getElementById('sous-titre').textContent = 'Tick it off, score points, and nobody keeps count in their head anymore.';
            document.getElementById('txt-app-store').textContent = 'Download on the App Store';
            document.getElementById('txt-play-store').textContent = 'Get it on Google Play';
            document.getElementById('txt-site').textContent = 'See the website';
        }

        // Sur téléphone, on file droit à la bonne boutique : la personne a touché
        // « Télécharger » sous la vidéo, elle attend la boutique, pas une page de plus.
        // replace() pour qu'un retour arrière ne la renvoie pas en boucle vers le store.
        // Sur ordinateur, la carte reste affichée avec les deux boutons.
        const ua = navigator.userAgent;
        const isAndroid = /Android/i.test(ua);
        const isIOS = /iPhone|iPad|iPod/i.test(ua);
        if (isAndroid) document.getElementById('app-store').hidden = true;
        if (isIOS) document.getElementById('play-store').hidden = true;
        if (isIOS) window.location.replace(appStore);
        else if (isAndroid) window.location.replace(playStore);
    })();
    </script>
</body>
</html>
